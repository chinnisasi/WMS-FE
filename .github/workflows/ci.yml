name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # Mirrors the meta-repo workspace layout so the documented pipeline path
  # (`../../backend/wms-be/openapi/openapi.json`) resolves exactly as it does
  # locally, then fails if the committed client doesn't match the spec.
  generated-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/core/frontend/wms-fe

      - name: Check out wms-be (spec source for the generated client)
        uses: actions/checkout@v4
        with:
          repository: chinnisasi/WMS-BE
          path: workspace/core/backend/wms-be

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: workspace/core/frontend/wms-fe

      - name: Regenerate client
        run: bun run api:generate
        working-directory: workspace/core/frontend/wms-fe

      - name: Generated-client drift guard (client matches committed spec)
        run: git diff --exit-code src/lib/api/generated
        working-directory: workspace/core/frontend/wms-fe

      # src/lib/users.ts is a hand-maintained mirror of wms-be's
      # permissions.ts, and users.test.ts can only restate the file under
      # test — three capabilities were missing from epics 2-3 before anything
      # noticed. This job already has wms-be checked out, so it is the place
      # to compare them.
      - name: Capability-mirror drift guard (users.ts matches permissions.ts)
        run: bun run check:capability-mirror
        working-directory: workspace/core/frontend/wms-fe

  image:
    # Story 6-2a — the production image (decision 10): build it, run it with
    # a runtime API address, and probe it. The web root must answer, and
    # /runtime-config.js must carry the address given at RUN time — the proof
    # that one image serves every environment. Nothing is pushed (story 6-2b).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t wms-fe:ci .

      - name: The image runs as non-root
        run: test "$(docker run --rm wms-fe:ci id -u)" != "0"

      - name: Run it with a runtime API address
        run: |
          docker run -d --name wms-fe -p 3001:3001 \
            -e WMS_API_BASE_URL=https://api.ci.example/api/v1 \
            wms-fe:ci

      - name: Smoke — the web root and the runtime config
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3001/login && break
            sleep 1
          done
          curl -sfL -o /dev/null -w 'web root: %{http_code}\n' http://localhost:3001/
          curl -sf http://localhost:3001/runtime-config.js | tee /dev/stderr \
            | grep -F '"apiBaseUrl":"https://api.ci.example/api/v1"'

      - name: Container logs
        if: always()
        run: docker logs wms-fe || true
